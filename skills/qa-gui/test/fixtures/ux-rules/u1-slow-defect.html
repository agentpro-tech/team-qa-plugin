<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>U1 defect: a slow save with no progress indicator</title>
<style>
  body { font: 16px sans-serif; margin: 24px; color: #222; }
  label { display: block; margin: 12px 0 4px; }
  input { font: inherit; padding: 6px; width: 260px; }
  button { font: inherit; padding: 8px 16px; margin-top: 16px; }
  #msg { min-height: 1.4em; color: #065f46; }
</style>
</head>
<body>
  <h1>Profile</h1>
  <form id="f">
    <label for="name">Display name</label>
    <input id="name" name="name">
    <button id="save" type="submit">Save</button>
  </form>
  <p id="msg" role="status"></p>
  <script>
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var body = JSON.stringify({ name: document.getElementById('name').value });
      // Defect: while the request is pending nothing changes on screen; feedback only arrives at the end.
      window.fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body })
        .then(function (r) { document.getElementById('msg').textContent = r.ok ? 'Saved' : 'Could not save'; });
    });
  </script>
</body>
</html>
