<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>U5 clean twin: a toast in a live region</title>
<style>
  body { font: 16px sans-serif; margin: 24px; color: #222; }
  button { font: inherit; padding: 8px 16px; }
  .toast-region { position: fixed; right: 24px; bottom: 24px; }
  .toast { background: #1f2937; color: #fff; padding: 12px 16px; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Settings</h1>
  <button id="save" type="button">Save settings</button>
  <!-- The live region exists before the message is inserted, so a screen reader announces it. -->
  <div class="toast-region" role="status" aria-live="polite"></div>
  <script>
    document.getElementById('save').addEventListener('click', function () {
      var t = document.createElement('div');
      t.className = 'toast';
      t.textContent = 'Settings saved';
      document.querySelector('.toast-region').appendChild(t);
      setTimeout(function () { t.remove(); }, 4000);
    });
  </script>
</body>
</html>
