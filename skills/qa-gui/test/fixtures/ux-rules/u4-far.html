<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>U4 defect: error text far from its field</title>
<style>
  body { font: 16px sans-serif; margin: 24px; color: #222; }
  label { display: block; margin: 12px 0 4px; }
  input { font: inherit; padding: 6px; width: 260px; border: 1px solid #888; }
  input[aria-invalid="true"] { border-color: #b00020; }
  .form-error { color: #b00020; font-size: 14px; margin: 0 0 8px; }
  .spacer { height: 260px; }
  button { font: inherit; padding: 8px 16px; margin-top: 16px; }
</style>
</head>
<body>
  <h1>Sign up</h1>
  <form id="f" novalidate>
    <!-- Defect: the message is referenced, but it is rendered far above the field it explains. -->
    <p class="form-error" id="email-error">Enter a valid email address</p>
    <label for="name">Name</label>
    <input id="name" name="name" value="Lan">
    <div class="spacer"></div>
    <label for="email">Email</label>
    <input id="email" name="email" value="not-an-email" aria-invalid="true" aria-describedby="email-error">
    <button type="submit">Create account</button>
  </form>
</body>
</html>
