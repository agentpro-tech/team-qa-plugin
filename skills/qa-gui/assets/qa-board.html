<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Board</title>
<style>
  :root{
    --bg:#ffffff; --tx:#37352f; --tx2:#5f5e5b; --tx3:#66645f;
    --line:#e9e9e7; --hover:#f7f7f5; --code:#f1f1ef; --focus:#2383e2;
    --g-bg:#dbeddb; --g-tx:#1c3829;
    --r-bg:#ffe2dd; --r-tx:#5d1715;
    --y-bg:#fdecc8; --y-tx:#402c1b;
    --b-bg:#d3e5ef; --b-tx:#183347;
    --n-bg:#e3e2e0; --n-tx:#32302c;
    --ease-out:cubic-bezier(0.23,1,0.32,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased}
  body{background:var(--bg);color:var(--tx);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif;
    padding:72px 96px 120px}
  @media (max-width:800px){body{padding:44px 20px 80px}}
  .page{max-width:960px;margin:0 auto}
  .icon{font-size:56px;line-height:1;margin-bottom:8px}
  h1{font-size:38px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;margin-bottom:22px}
  h2{font-size:19px;font-weight:600;letter-spacing:-0.01em;margin:30px 0 10px;display:flex;align-items:center;gap:8px}
  h2 svg.i{width:17px;height:17px;stroke:var(--tx2)}
  svg.i{width:15px;height:15px;stroke:var(--tx3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
  /* properties */
  .prop{display:flex;align-items:baseline;min-height:30px;font-size:14px}
  .prop .k{flex:0 0 152px;color:var(--tx3);display:flex;gap:8px;align-items:center}
  .prop .v{color:var(--tx);word-break:break-word}
  .sumline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .divider{border:none;border-top:1px solid var(--line);margin:18px 0 4px}
  /* pills */
  .pill{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12.5px;font-weight:500;white-space:nowrap}
  .pill.PASS{background:var(--g-bg);color:var(--g-tx)}
  .pill.FAIL{background:var(--r-bg);color:var(--r-tx)}
  .pill.BLOCKED{background:var(--y-bg);color:var(--y-tx)}
  .pill.RUNNING{background:var(--b-bg);color:var(--b-tx)}
  .pill.PENDING{background:var(--n-bg);color:var(--n-tx)}
  .pill.count{background:var(--n-bg);color:var(--n-tx);font-weight:400}
  .pill.cmt{background:var(--y-bg);color:var(--y-tx);font-weight:400}
  /* severity chips */
  .sev{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;text-transform:capitalize}
  .sev.critical{background:var(--r-bg);color:var(--r-tx)}
  .sev.major{background:var(--y-bg);color:var(--y-tx)}
  .sev.minor{background:var(--n-bg);color:var(--n-tx)}
  /* defect status pills */
  .dst{display:inline-block;padding:1px 7px;border-radius:4px;font-size:12px;font-weight:500;text-transform:capitalize}
  .dst.open{background:var(--r-bg);color:var(--r-tx)}
  .dst.fixed{background:var(--b-bg);color:var(--b-tx)}
  .dst.retested{background:var(--y-bg);color:var(--y-tx)}
  .dst.closed{background:var(--g-bg);color:var(--g-tx)}
  /* table */
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:860px}
  thead th{font-size:12px;font-weight:400;color:var(--tx3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th svg.i{width:13px;height:13px;margin-right:5px}
  tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
  tbody tr.crow{transition:background 140ms var(--ease-out)}
  tbody tr.crow:hover{background:var(--hover)}
  .cname{font-weight:500;min-width:240px}
  .cid{color:var(--tx3);font-size:12px;font-weight:400;margin-right:6px}
  .req{font-size:12px;color:var(--tx2);white-space:nowrap}
  .rnd{font-size:12px;color:var(--tx3);text-align:center}
  details{margin-top:5px}
  summary{cursor:pointer;font-size:12.5px;color:var(--tx3);user-select:none;list-style:none}
  summary::before{content:"\25B8  ";font-size:10px}
  details[open] summary::before{content:"\25BE  "}
  summary:hover{color:var(--tx2)}
  .kv{margin:6px 0 2px 14px;font-size:13px;color:var(--tx2)}
  .kv dt{color:var(--tx3);font-size:12px;margin-top:5px}
  .kv dd{margin:1px 0 0}
  .vcell{font-size:13px;color:var(--tx2);min-width:120px}
  .vcell b{font-weight:500}
  .v-pass{color:#337a4d} .v-fail{color:#b1443d} .v-warn{color:#7a5700}
  .dim{color:var(--tx3);font-size:12px}
  .states{font-size:12px;color:var(--tx3);min-width:104px}
  .shots{display:flex;gap:6px;flex-wrap:wrap;min-width:110px}
  .shot{cursor:zoom-in}
  .shot img{width:52px;height:36px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:4px;display:block;background:var(--code);transition:box-shadow 140ms var(--ease-out)}
  .shot:hover img{box-shadow:0 1px 2px rgba(15,15,15,.08),0 3px 8px rgba(15,15,15,.10)}
  .artifact{width:52px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:4px;background:var(--code);color:var(--tx);font:600 10px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;text-decoration:none;text-transform:uppercase;overflow:hidden}
  .artifact:hover{border-color:var(--focus);box-shadow:0 0 0 2px rgba(35,131,226,.14)}
  .note{font-size:12.5px;color:#7a5700;margin-top:5px}
  .empty{color:var(--tx3);font-size:14px;padding:40px 10px;text-align:center}
  footer{margin-top:34px;font-size:12px;color:var(--tx3)}
  code{background:var(--code);color:var(--tx);border-radius:3px;padding:1px 5px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  /* defect filter */
  .dfilter{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
  .dfilter button{font:500 12px/1 inherit;color:var(--tx2);background:var(--code);border:1px solid transparent;border-radius:5px;padding:5px 10px;cursor:pointer;transition:background 120ms var(--ease-out),border-color 120ms var(--ease-out)}
  .dfilter button:hover{background:var(--n-bg)}
  .dfilter button.on{background:#fff;border-color:var(--focus);color:var(--tx)}
  /* release banner */
  .release{margin:8px 0 2px;border-radius:10px;padding:16px 20px;border:1px solid var(--line)}
  .release .verdict{font-size:22px;font-weight:700;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px}
  .release.GO{background:var(--g-bg)} .release.GO .verdict{color:var(--g-tx)}
  .release.NOGO{background:var(--r-bg)} .release.NOGO .verdict{color:var(--r-tx)}
  .release.RISK{background:var(--y-bg)} .release.RISK .verdict{color:var(--y-tx)}
  .release .meta{font-size:12.5px;color:var(--tx2);margin-top:6px}
  .release .risks{margin:8px 0 0 2px;font-size:13px;color:var(--tx)}
  .release .risks b{font-weight:600}
  /* sbtm blocks */
  .sbtm{font-size:13.5px;color:var(--tx);margin:2px 0 4px}
  .sbtm .lbl{color:var(--tx3);font-size:12px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:3px}
  .sbtm ul{margin:2px 0 10px 18px}
  .sbtm li{margin:2px 0}
  .untested li b{font-weight:600}
  .roundcard{border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:7px;font-size:13px}
  .roundcard .rh{font-weight:600;color:var(--tx)}
  .roundcard .rm{color:var(--tx3);font-size:12px}
  /* comments */
  .cbtn{display:inline-flex;align-items:center;gap:5px;min-height:24px;margin-top:7px;font-size:12.5px;color:var(--tx3);background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px;transition:background 140ms var(--ease-out),color 140ms var(--ease-out)}
  .cbtn:hover{background:var(--code);color:var(--tx2)}
  .cbtn .n{font-variant-numeric:tabular-nums}
  .cbtn.haspending{color:var(--y-tx);background:var(--y-bg)}
  tr.thread td{background:#fbfbfa;padding:12px 16px 14px 46px}
  .cm{display:flex;gap:9px;margin-bottom:11px}
  .cm:last-of-type{margin-bottom:0}
  .av{flex:0 0 22px;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
  .av.u{background:#d9730d}
  .av.a{background:#37352f}
  .cbody{flex:1;min-width:0}
  .chead{font-size:12px;color:var(--tx3);margin-bottom:1px}
  .chead b{color:var(--tx);font-weight:500}
  .chead .tag{font-size:10.5px;background:var(--code);color:var(--tx2);border-radius:3px;padding:0 5px;margin-left:5px}
  .chead .tag.pend{background:var(--y-bg);color:var(--y-tx)}
  .ctext{font-size:13.5px;color:var(--tx);word-break:break-word}
  .composer{display:flex;gap:8px;margin-top:12px}
  .composer input{flex:1;font:13.5px/1.4 inherit;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff;outline:none;transition:border-color 140ms var(--ease-out),box-shadow 140ms var(--ease-out)}
  .composer input:focus{border-color:var(--focus);box-shadow:0 0 0 2px rgba(35,131,226,.18)}
  .composer button{font:500 13px/1 inherit;color:#fff;background:var(--focus);border:none;border-radius:6px;padding:0 14px;cursor:pointer;transition:opacity 120ms var(--ease-out)}
  .composer button:hover{opacity:.9}
  .composer button:active{transform:scale(0.97)}
  .chint{font-size:11.5px;color:var(--tx3);margin-top:7px}
  /* lightbox */
  #lightbox{position:fixed;inset:0;background:rgba(15,15,15,.6);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:32px;opacity:0;transition:opacity 150ms var(--ease-out)}
  #lightbox.open{display:flex;opacity:1}
  #lightbox img{max-width:94%;max-height:86%;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.18),0 20px 50px rgba(0,0,0,.32);background:#fff}
  #lightbox .lcap{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:13px;opacity:.85}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
</style>
</head>

<div class="page">
  <div class="icon" id="picon"></div>
  <h1 id="t"></h1>
  <div class="props" id="props"></div>
  <div id="charter"></div>
  <div id="release"></div>
  <hr class="divider">
  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th style="width:26%"><svg class="i"><use href="#ic-aa"/></svg>Case</th>
          <th><svg class="i"><use href="#ic-link"/></svg>Req</th>

          <th><svg class="i"><use href="#ic-st"/></svg>Status</th>

          <th><svg class="i"><use href="#ic-eye"/></svg>Visual</th>

  <div class="empty" id="empty" style="display:none">No cases yet. The agent fills in <code>QA_DATA</code> when the run starts.</div>
  <div id="defects"></div>
  <div id="sbtm"></div>
  <footer>qa-gui · data inline in this file (the <code>QA_DATA</code> block) · images in the same folder · comments are kept in the browser until the agent reads them · press <b>R</b> to reload</footer>
</div>
<div id="lightbox" role="dialog" aria-label="Evidence zoom"><img id="lbimg" alt=""><video id="lbvid" controls style="display:none;max-width:94%;max-height:86%;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.35);background:#000"></video><div class="lcap" id="lbcap"></div></div>

<script id="qa-data">
window.QA_DATA = {
  "schemaVersion": 5,
  "canonicalVersion": "qa-board-teamwork/v1",
  "rev": 0,
  "boardId": "sample-2026-01-01",
  "title": "Mẫu kế hoạch kiểm thử giao diện",
  "boardCreated": "2026-01-01T08:00:00+07:00",

  "deepCheck": "available",

  "runUuid": "00000000-0000-4000-8000-000000000002",
  "commit": "0000000000000000000000000000000000000000",
  "build": "UNVERIFIED-PLAN",
  "env": "LOCAL",
  "db": "not-applicable",
  "role": "qa-agent",
  "testProfile": "plan-not-run",
  "evidenceManifest": [],
  "currentRound": 1,
  "untested": [],
  "rounds": [
    { "round": 1, "startedAt": "2026-01-01T08:00:00+07:00", "scope": "Phạm vi kiểm thử ban đầu" }
  ],
  "coverage": [],
  "cases": [],
  "defects": [],

};

<script>
(function(){
  // Defensive render only. qa-gate owns schema/semantic truth and rejects unversioned boards.
  var D = Object.assign({cases:[],defects:[],rounds:[],untested:[],obstacles:[],outlook:[],coverage:[],release:{}}, window.QA_DATA || {});
  var BID = D.boardId || ((D.title||'board')+'|'+(D.date||''));
  var LSKEY = 'qaboard:'+BID;
  document.title = 'QA Board · ' + (D.title||'');
  document.getElementById('picon').textContent = D.icon || '🧪';
  document.getElementById('t').textContent = D.title || 'QA Board';

  function lsGet(){ try{ return JSON.parse(localStorage.getItem(LSKEY)||'[]'); }catch(e){ return []; } }
  function lsSet(v){ try{ localStorage.setItem(LSKEY, JSON.stringify(v)); return true; }catch(e){ return false; } }
  var pend = lsGet();

  var cs = D.cases||[], n = {PASS:0,FAIL:0,BLOCKED:0,RUNNING:0,PENDING:0};
  cs.forEach(function(c){ var s=(c.status||'PENDING').toUpperCase(); n[s]=(n[s]||0)+1; });
  var defs = D.defects||[];
  var sevN = {critical:0,major:0,minor:0};
  defs.forEach(function(d){ var sv=(d.sev||'minor').toLowerCase(); sevN[sv]=(sevN[sv]||0)+1; });
  var untested = D.untested||[];

  function ic(id){ return '<svg class="i"><use href="#'+id+'"/></svg>'; }
  var P = [];
  function prop(icon,label,val){ if(val) P.push('<div class="prop"><span class="k">'+ic(icon)+label+'</span><span class="v">'+esc(val)+'</span></div>'); }
  prop('ic-link','App', D.app);
  prop('ic-db','Env / DB', D.envDb);
  prop('ic-hash','Build', D.build);
  prop('ic-vp','Viewport', D.viewport);
  if(D.schemaVersion===3 && D.vision){
    prop('ic-eye','Vision', 'v'+(D.vision.version||1)+' · '+(D.vision.viewport||D.viewport||''));
    prop('ic-img','Baseline manifest', D.vision.baselineManifest);
  }
  prop('ic-cal','Date', D.date);
  prop('ic-cal','Plan created', D.boardCreated);
  prop('ic-user','Agent', D.agent);
  var sumHtml = '<span class="pill count">'+cs.length+' cases</span>';
  ['PASS','FAIL','BLOCKED','RUNNING','PENDING'].forEach(function(k){
    if(n[k]) sumHtml += '<span class="pill '+k+'">'+n[k]+' '+k.toLowerCase()+'</span>';
  });
  var totalGraded = (n.PASS||0)+(n.FAIL||0);
  if(totalGraded){ var pr=Math.round((n.PASS/totalGraded)*100); sumHtml += '<span class="pill count">pass-rate '+pr+'%</span>'; }
  ['critical','major','minor'].forEach(function(k){
    if(sevN[k]) sumHtml += '<span class="sev '+k+'">'+sevN[k]+' '+k+'</span>';
  });
  if(untested.length) sumHtml += '<span class="pill count">'+untested.length+' untested</span>';
  var rel0 = D.release||{};
  if(rel0.verdict) sumHtml += '<span class="pill '+relClass(rel0.verdict)+'">'+esc(rel0.verdict)+'</span>';
  if(pend.length) sumHtml += '<span class="pill cmt">'+pend.length+' comment(s) waiting for agent</span>';
  P.push('<div class="prop"><span class="k">'+ic('ic-sum')+'Summary</span><span class="v sumline" id="sumline">'+sumHtml+'</span></div>');
  document.getElementById('props').innerHTML = P.join('');

  // ── charter (SBTM mission) ──
  if(D.charter){
    document.getElementById('charter').innerHTML =
      '<div class="sbtm" style="margin-top:14px"><div class="lbl">Charter</div>'+esc(D.charter)+'</div>';
  }

  // ── release banner ──
  (function(){
    var r = D.release||{};
    if(!r.verdict){ return; }
    var el = document.getElementById('release');
    var risks='';
    if((r.risks||[]).length){ risks = '<div class="risks"><b>Accepted risks:</b> '+(r.risks||[]).map(esc).join(', ')+'</div>'; }
    var meta = [];
    if(r.by) meta.push('by '+esc(r.by));
    if(r.ts) meta.push(esc(r.ts));
    el.innerHTML = '<div class="release '+relClass(r.verdict)+'"><div class="verdict">'+ic('ic-flag')+esc(r.verdict)+'</div>'
      + risks + (meta.length?'<div class="meta">'+meta.join(' · ')+'</div>':'') + '</div>';
  })();

  var rows = document.getElementById('rows');
  if(!cs.length){ document.getElementById('empty').style.display='block'; }

  function cmCount(c){ return (c.comments||[]).length + pend.filter(function(p){return p.caseId===c.id;}).length; }
  function cmPend(c){ return pend.some(function(p){return p.caseId===c.id;}); }
  function evSrc(e){ return (typeof e === 'string') ? e : (e && (e.img||e.video||e.src||'')) || ''; }
  function evLabel(e){ return (typeof e === 'string') ? e : (e && (e.label||e.img||e.video||e.src)) || ''; }

  cs.forEach(function(c,idx){
    var s=(c.status||'PENDING').toUpperCase();
    var tr=document.createElement('tr'); tr.className='crow';
    var name='<span class="cid">'+esc(c.id||'')+'</span>'+esc(c.desc||'');
    if(c.steps||c.expected) name+='<details><summary>steps &amp; expected</summary><dl class="kv">'
      +(c.steps?'<dt>Steps</dt><dd>'+esc(c.steps)+'</dd>':'')
      +(c.expected?'<dt>Expected</dt><dd>'+esc(c.expected)+'</dd>':'')+'</dl></details>';
    if(c.note) name+='<div class="note">'+esc(c.note)+'</div>';
    var cc=cmCount(c);
    name+='<button class="cbtn'+(cmPend(c)?' haspending':'')+'" data-cx="'+idx+'">'+ic('ic-cmt')+'<span class="n">'+(cc||'')+'</span> comment</button>';
    var shots='<span class="dim">Empty</span>';
    if(c.evidence&&c.evidence.length){
      shots='<div class="shots">';
      c.evidence.forEach(function(e){
        var src=evSrc(e), cap=evLabel(e);
        if(/\.(mp4|webm|mov)$/i.test(src)){
          shots+='<span class="shot vid" data-vid="'+esc(src)+'" data-cap="'+esc(cap)+'" style="position:relative"><video muted preload="metadata" src="'+esc(src)+'" style="width:52px;height:36px;object-fit:cover;border:1px solid var(--line);border-radius:4px;display:block;background:#111"></video><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.6)">&#9654;</span></span>';
        } else if(/\.(png|jpe?g|gif|webp|avif|svg)$/i.test(src)) {
          shots+='<span class="shot" data-img="'+esc(src)+'" data-cap="'+esc(cap)+'"><img loading="lazy" src="'+esc(src)+'" alt="'+esc(cap)+'"></span>';
        } else {
          var ext=(src.split('.').pop()||'file').split(/[?#]/)[0].slice(0,8);
          shots+='<a class="artifact" href="'+esc(src)+'" target="_blank" rel="noopener" title="'+esc(cap)+'">'+esc(ext)+'</a>';
        }
      });
      shots+='</div>';
    }
    var visual = vv(c.visual);
    if(c.visualEvidence&&c.visualEvidence.length){
      visual += '<details><summary>pixel diff</summary><dl class="kv">'
        + c.visualEvidence.map(function(v){
          var pct = typeof v.diffPercent==='number' ? v.diffPercent+'%' : '—';
          return '<dt>'+esc(v.state||'state')+' @ '+esc(v.viewport||D.viewport||'')+'</dt><dd>'
            +esc((v.verdict||v.severity||'compared')+' · '+pct+(v.diff?' · '+v.diff:''))+'</dd>';
        }).join('')+'</dl></details>';
    }
    tr.innerHTML = '<td class="cname">'+name+'</td>'
      +'<td class="req">'+esc(c.req||'')+'</td>'
      +'<td class="rnd">'+esc(c.round==null?'':c.round)+'</td>'
      +'<td><span class="pill '+s+'">'+cap(s)+'</span></td>'
      +'<td class="vcell">'+vv(c.fn)+'</td>'
      +'<td class="vcell">'+vv(c.ui)+'</td>'
      +'<td class="vcell">'+visual+'</td>'
      +'<td>'+shots+'</td>'
      +'<td class="states">'+esc((c.states||[]).join(', ')||'')+'</td>';
    rows.appendChild(tr);

    var trc=document.createElement('tr'); trc.className='thread'; trc.style.display='none'; trc.setAttribute('data-thread',idx);
    trc.innerHTML='<td colspan="9"><div class="cms" id="cms-'+idx+'"></div>'
      +'<div class="composer"><input id="ci-'+idx+'" type="text" maxlength="500" placeholder="Write a comment for '+esc(c.id||'case')+'... (Enter to send)">'
      +'<button data-send="'+idx+'">Send</button></div>'
      +'<div class="chint">Comments are saved in your browser; the agent reads them and writes them into the file on the next QA pass.</div></td>';
    rows.appendChild(trc);
    renderThread(idx);
  });

  // ── defects table ──
  (function(){
    if(!defs.length){ return; }
    var el = document.getElementById('defects');
    var filt = '<div class="dfilter" id="dfilter">'
      + '<button data-f="all" class="on">All ('+defs.length+')</button>'
      + ['open','fixed','retested','closed'].map(function(st){
          var c=defs.filter(function(d){return (d.status||'open').toLowerCase()===st;}).length;
          return c? '<button data-f="'+st+'">'+cap(st)+' ('+c+')</button>' : '';
        }).join('')
      + '</div>';
    var body='';
    defs.forEach(function(d){
      var st=(d.status||'open').toLowerCase();
      body += '<tr class="crow drow" data-st="'+st+'">'
        +'<td><b>'+esc(d.id||'')+'</b>'
          +(d.repro||d.expected||d.actual? '<details><summary>repro / expected / actual</summary><dl class="kv">'
             +(d.repro?'<dt>Repro</dt><dd>'+esc(d.repro)+'</dd>':'')
             +(d.expected?'<dt>Expected</dt><dd>'+esc(d.expected)+'</dd>':'')
             +(d.actual?'<dt>Actual</dt><dd>'+esc(d.actual)+'</dd>':'')+'</dl></details>':'')+'</td>'
        +'<td><code>'+esc(d.rule||'')+'</code></td>'
        +'<td><span class="sev '+esc((d.sev||'minor').toLowerCase())+'">'+esc(d.sev||'minor')+'</span></td>'
        +'<td>'+esc(d.pri||'')+'</td>'
        +'<td>'+esc(d.caseId||'')+'</td>'
        +'<td><span class="dst '+st+'">'+cap(st)+'</span></td></tr>';
    });
    el.innerHTML = '<h2>'+ic('ic-bug')+'Defects ('+defs.length+')</h2>'+filt
      + '<div class="tablewrap"><table><thead><tr>'
      + '<th style="width:26%">ID</th><th>Rule</th><th>Severity</th><th>Priority</th><th>Case</th><th>Status</th>'
      + '</tr></thead><tbody id="defrows">'+body+'</tbody></table></div>';
    var df=document.getElementById('dfilter');
    df.addEventListener('click',function(ev){
      var b=ev.target.closest('button'); if(!b) return;
      df.querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on');
      var f=b.getAttribute('data-f');
      document.querySelectorAll('#defrows .drow').forEach(function(r){
        r.style.display = (f==='all'||r.getAttribute('data-st')===f)?'':'none';
      });
    });
  })();

  // ── SBTM blocks: obstacles / outlook / untested / rounds ──
  (function(){
    var el = document.getElementById('sbtm'); var h='';
    function listBlock(title,icon,arr){
      if(!arr||!arr.length) return '';
      return '<h2>'+ic(icon)+esc(title)+'</h2><div class="sbtm"><ul>'
        + arr.map(function(x){return '<li>'+esc(x)+'</li>';}).join('') + '</ul></div>';
    }
    h += listBlock('Obstacles','ic-flag', D.obstacles||[]);
    h += listBlock('Outlook','ic-map', D.outlook||[]);
    if(untested.length){
      h += '<h2>'+ic('ic-eye')+'Untested ('+untested.length+')</h2><div class="sbtm untested"><ul>'
        + untested.map(function(u){
            if(typeof u==='string') return '<li>'+esc(u)+'</li>';
            return '<li><b>'+esc(u.area||'')+'</b>'+(u.reason?' — '+esc(u.reason):'')+'</li>';
          }).join('') + '</ul></div>';
    }
    var coverage = D.coverage||[];
    if(coverage.length){
      h += '<h2>'+ic('ic-st')+'Coverage ('+coverage.length+')</h2><div class="sbtm"><ul>'
        + coverage.map(function(cv){
            var st=(cv.status||'').toLowerCase();
            var mark = st==='tick' ? '✅' : (st==='waive' ? '⚠️ waived' : '—');
            return '<li><b>'+esc(cv.area||'')+'</b> — '+mark+(cv.note?' · '+esc(cv.note):'')+'</li>';
          }).join('') + '</ul></div>';
    }
    var rounds = D.rounds||[];
    if(rounds.length){
      h += '<h2>'+ic('ic-loop')+'Rounds ('+rounds.length+')</h2>';
      rounds.forEach(function(r){
        h += '<div class="roundcard"><div class="rh">Round '+esc(r.n==null?'':r.n)+(r.scope?' · '+esc(r.scope):'')+'</div>'
          + '<div class="rm">'+[r.date?esc(r.date):'', r.agent?esc(r.agent):''].filter(Boolean).join(' · ')+'</div>'
          + (r.delta?'<div style="margin-top:3px">'+esc(r.delta)+'</div>':'')+'</div>';
      });
    }
    el.innerHTML = h;
  })();

  function renderThread(idx){
    var c=cs[idx], box=document.getElementById('cms-'+idx);
    if(!box) return;
    var items=[];
    (c.comments||[]).forEach(function(m){ items.push({by:m.by||'user',author:m.author,text:m.text,ts:m.ts,pending:false}); });
    pend.filter(function(p){return p.caseId===c.id;}).forEach(function(p){ items.push({by:'user',author:p.author,text:p.text,ts:p.ts,pending:true}); });
    items.sort(function(a,b){return (a.ts||0)-(b.ts||0);});
    var h='';
    items.forEach(function(m){
      var a=(m.by==='agent');
      h+='<div class="cm"><span class="av '+(a?'a':'u')+'">'+esc((m.author||'?').charAt(0).toUpperCase())+'</span>'
        +'<span class="cbody"><div class="chead"><b>'+esc(m.author||'')+'</b> · '+ft(m.ts)
        +(a?'<span class="tag">agent</span>':'')+(m.pending?'<span class="tag pend">waiting for agent</span>':'')+'</div>'
        +'<div class="ctext">'+esc(m.text||'')+'</div></span></div>';
    });
    box.innerHTML = h || '<div class="dim" style="margin-bottom:4px">No comments yet.</div>';
  }

  rows.addEventListener('click',function(ev){
    var sh=ev.target.closest('.shot');
    if(sh){ openLb(sh); return; }
    var cb=ev.target.closest('.cbtn');
    if(cb){ var i=cb.getAttribute('data-cx'); var t=rows.querySelector('[data-thread="'+i+'"]');
      var show=t.style.display==='none'; t.style.display=show?'':'none';
      if(show){ var inp=document.getElementById('ci-'+i); if(inp) inp.focus(); } return; }
    var sd=ev.target.closest('[data-send]');
    if(sd){ send(+sd.getAttribute('data-send')); }
  });
  rows.addEventListener('keydown',function(ev){
    if(ev.key==='Enter' && ev.target.id && ev.target.id.indexOf('ci-')===0){ send(+ev.target.id.slice(3)); }
  });

  function send(idx){
    var inp=document.getElementById('ci-'+idx); if(!inp) return;
    var txt=(inp.value||'').trim(); if(!txt) return;
    var c=cs[idx];
    pend.push({caseId:c.id, author:D.commentAuthor||'Reviewer', text:txt, ts:Date.now()});
    if(!lsSet(pend)){ alert('Could not save to localStorage. Copy this comment and send it to the agent manually:\n\n'+txt); return; }
    inp.value='';
    renderThread(idx); refreshBadges();
  }
  function refreshBadges(){
    cs.forEach(function(c,i){
      var btn=rows.querySelector('.cbtn[data-cx="'+i+'"]');
      if(btn){ btn.querySelector('.n').textContent=cmCount(c)||''; btn.classList.toggle('haspending',cmPend(c)); }
    });
    var pills='';
    if(pend.length) pills='<span class="pill cmt">'+pend.length+' comment(s) waiting for agent</span>';
    var sl=document.getElementById('sumline');
    var old=sl.querySelector('.pill.cmt'); if(old) old.remove();
    if(pend.length) sl.insertAdjacentHTML('beforeend', pills);
  }

  var lb=document.getElementById('lightbox'), li=document.getElementById('lbimg'), lc=document.getElementById('lbcap'), lv=document.getElementById('lbvid');
  function openLb(sh){
    var vid=sh.getAttribute('data-vid');
    if(vid){ li.style.display='none'; li.removeAttribute('src'); lv.style.display='block'; lv.src=vid; lv.play&&lv.play().catch(function(){}); }
    else { lv.style.display='none'; lv.pause&&lv.pause(); lv.removeAttribute('src'); li.style.display='block'; li.src=sh.getAttribute('data-img'); }
    lc.textContent=sh.getAttribute('data-cap')||''; lb.classList.add('open');
  }
  function closeLb(){ lb.classList.remove('open'); li.removeAttribute('src'); lv.pause&&lv.pause(); lv.removeAttribute('src'); lv.style.display='none'; li.style.display='block'; }
  lb.addEventListener('click',function(ev){ if(ev.target!==lv) closeLb(); });
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'){ closeLb(); }
    if((ev.key==='r'||ev.key==='R') && !lb.classList.contains('open') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) location.reload();
  });

  function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];}); }
  function cap(s){ return String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1).toLowerCase(); }
  function relClass(v){ var u=String(v||'').toUpperCase(); if(u==='GO') return 'GO'; if(u==='NO-GO'||u==='NOGO') return 'NOGO'; return 'RISK'; }
  function ft(ts){ if(!ts) return ''; var d=new Date(ts); function z(x){return (x<10?'0':'')+x;}
    return z(d.getHours())+':'+z(d.getMinutes())+' '+z(d.getDate())+'/'+z(d.getMonth()+1); }
  function vv(v){ if(!v) return '<span class="dim">Empty</span>'; var c='v-warn'; var u=String(v).toUpperCase();
    if(u.indexOf('FAIL')===0) c='v-fail'; else if(u.indexOf('PASS')===0||u.indexOf('OK')===0) c='v-pass';
    return '<b class="'+c+'">'+esc(v)+'</b>'; }

  // ═══ Agent API (read via Dragon executeJs) ═══
  window.__qaBoardComments = function(){ return { boardId: BID, lsKey: LSKEY, pending: lsGet() }; };
  window.__qaBoardClearPending = function(){ var p=lsGet(); localStorage.removeItem(LSKEY); return {cleared:p.length}; };
})();
</script>
</body>
</html>
