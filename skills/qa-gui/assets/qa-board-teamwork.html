<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA Board · Teamwork</title>
<style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#172033;--muted:#667085;--line:#e5e8ef;--soft:#f2f4f7;--blue:#2563eb;--green:#067647;--green-bg:#ecfdf3;--red:#b42318;--red-bg:#fef3f2;--amber:#b54708;--amber-bg:#fffaeb;--violet:#6941c6;--violet-bg:#f4f3ff;--shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06)}
*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body{margin:0}.page{width:min(1120px,calc(100% - 32px));margin:40px auto 112px}.hero{padding:28px 32px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #dbeafe}h1{font-size:32px;line-height:1.15;letter-spacing:-.03em;margin:14px 0 8px}.subtitle{color:var(--muted);max-width:720px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.meta span,.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:var(--soft);color:#475467;font-size:12px;font-weight:600}.section{margin-top:30px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 4px 10px}.section h2{font-size:17px;margin:0;letter-spacing:-.01em}.section-note{color:var(--muted);font-size:12px}.list{display:grid;gap:8px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.025)}.item[open]{box-shadow:var(--shadow);border-color:#d0d5dd}.row{display:grid;grid-template-columns:minmax(260px,1fr) 150px 110px 150px;gap:10px;align-items:center;min-height:62px;padding:10px 14px;cursor:pointer;list-style:none}.row::-webkit-details-marker{display:none}.row:hover{background:#fafbfc}.identity{display:flex;align-items:center;gap:11px;min-width:0}.state-mark{display:grid;place-items:center;flex:0 0 28px;width:28px;height:28px;border-radius:9px;background:var(--soft);font-size:13px;font-weight:800}.state-mark.pass,.status-PASS,.status-VERIFIED,.status-CLOSED{color:var(--green);background:var(--green-bg)}.state-mark.fail,.status-FAIL,.status-REOPENED,.status-REJECTED{color:var(--red);background:var(--red-bg)}.state-mark.blocked,.status-BLOCKED,.status-DEFERRED{color:var(--amber);background:var(--amber-bg)}.state-mark.work,.status-DOING,.status-ASSIGNED,.status-FIXING,.status-RETEST{color:var(--violet);background:var(--violet-bg)}.title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.id{color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:2px}.related{margin-left:6px;color:var(--blue)}select,input[type=text]{width:100%;min-height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:13px inherit;padding:6px 9px;outline:none}select:focus,input[type=text]:focus,button:focus-visible{border-color:var(--blue);box-shadow:0 0 0 3px #dbeafe}.control-label{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 3px 2px}.detail{border-top:1px solid var(--line);padding:20px 22px 24px;background:#fcfcfd}.human{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary{border:1px solid var(--line);border-radius:10px;background:#fff;padding:13px 14px}.summary b{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}.machine{margin-top:12px;border:1px dashed #d0d5dd;border-radius:10px;background:var(--soft);padding:0 12px}.machine summary{padding:10px 0;color:var(--muted);font-size:12px;cursor:pointer}.mono{font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;padding:0 0 12px;white-space:pre-wrap;word-break:break-word}.subgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px}.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}.timeline{display:grid;gap:7px}.event{display:grid;grid-template-columns:50px 1fr auto;gap:9px;color:#475467;font-size:12px;padding:6px 0;border-bottom:1px solid var(--soft)}.event:last-child{border:0}.event strong{color:var(--ink)}.event time{color:var(--muted)}.comments{display:grid;gap:8px}.comment{background:var(--soft);border-radius:9px;padding:9px 10px}.comment.pending{background:var(--amber-bg)}.comment-head{font-size:11px;color:var(--muted);margin-bottom:3px}.comment-head b{color:var(--ink)}.composer{display:flex;gap:8px;margin-top:10px}.composer button,.packet{border:0;border-radius:8px;background:var(--blue);color:#fff;font:600 13px inherit;padding:7px 12px;cursor:pointer}.empty{padding:24px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px}.pending-bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#101828;color:#fff;padding:10px 12px 10px 16px;border-radius:12px;box-shadow:0 18px 45px rgba(16,24,40,.24);z-index:20}.pending-bar small{color:#d0d5dd}.pending-count{font-weight:800}.packet{background:#fff;color:#101828}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.legend .chip{background:#fff;border:1px solid var(--line)}
.item:not([open])>.detail{display:none}.pending-bar[hidden]{display:none}
.evidence-button{border:0;border-radius:8px;background:var(--blue);color:#fff;font:600 13px inherit;padding:7px 12px;cursor:pointer}.evidence-tools{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:10px}.evidence-tools input[type=file]{min-height:36px;font-size:12px;color:var(--muted);min-width:0}.evidence-list{display:flex;gap:6px;flex-wrap:wrap}.evidence-list .chip.pending{background:var(--amber-bg);color:var(--amber)}
.evidence-pairs{display:grid;gap:14px}.finding-evidence{margin:0}.finding-evidence img{display:block;width:100%;max-height:340px;object-fit:contain;border:1px solid var(--line);border-radius:9px;background:var(--soft)}.finding-evidence figcaption{color:#475467;font-size:12px;margin-top:6px}.evidence-original{display:inline-block;margin-top:4px;color:var(--blue);font-weight:600}
.source-issues ul{display:grid;gap:9px;margin:0;padding-left:18px}.source-item a{color:var(--blue);font-weight:650}.source-item code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.source-reason{margin-top:4px;color:#475467;font-size:12px}
@media(max-width:820px){.page{width:min(100% - 20px,1120px);margin-top:16px}.hero{padding:22px 20px}.meta span{max-width:100%;white-space:normal;overflow-wrap:anywhere}.row{grid-template-columns:minmax(0,1fr) 120px}.identity>div{min-width:0}.assignee-cell,.priority-cell{display:none}select,input[type=text],input[type=file],.composer button,.packet,.evidence-button{min-height:44px}.human,.subgrid{grid-template-columns:1fr}.detail{padding:16px}.pending-bar{width:calc(100% - 24px);justify-content:space-between}.evidence-tools{grid-template-columns:1fr}}
@media(max-width:560px){.pending-bar{position:static;transform:none;width:calc(100% - 20px);margin:18px auto 16px;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div hidden id="machine-values"><span data-machine-value="PASS"></span><span data-machine-value="FAIL"></span><span data-machine-value="BLOCKED"></span><select data-edit-field="status"></select><select data-edit-field="priority"></select></div>
<main class="page">
  <header class="hero">
    <div class="eyebrow"><span class="dot"></span><span id="eyebrow">QA teamwork</span></div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="meta" id="meta"></div>
    <div class="legend" id="legend"></div>
  </header>
  <section class="section" aria-labelledby="case-title">
    <div class="section-head"><h2 id="case-title">Cases</h2><span class="section-note" id="case-note"></span></div>
    <div class="list" id="cases"></div>
    __CASE_SOURCE_TRACEABILITY__
  </section>
  <section class="section" aria-labelledby="defect-title">
    <div class="section-head"><h2 id="defect-title">Defects</h2><span class="section-note" id="defect-note"></span></div>
    <div class="list" id="defects"></div>
    __DEFECT_HANDOFFS__
    __DEFECT_EVIDENCE__
  </section>
  <section class="section" aria-labelledby="release-title">
    <div class="section-head"><h2 id="release-title">Release</h2></div>
    <div class="card" id="release"></div>
  </section>
</main>
<div class="pending-bar" aria-live="polite" hidden><span><b class="pending-count" id="pending-count">0</b> <small id="pending-label">thay đổi chờ agent ghi nhận</small></span><button class="packet" id="packet">Tải packet</button></div>
<script>
/* QA_DATA_START */
window.QA_DATA = __QA_DATA__;
/* QA_DATA_END */
(function(){
'use strict';
var D=window.QA_DATA||{};
var KEY='qa-teamwork:'+D.boardId;
var STATUSES=['TODO','DOING','PASS','FAIL','BLOCKED','ASSIGNED','FIXING','RETEST','VERIFIED','CLOSED','REOPENED','REJECTED','DEFERRED'];
var PRIORITIES=['P1','P2','P3','P4'];
var TEXT={
  vi:{cases:'Ca kiểm thử',defects:'Lỗi cần xử lý',release:'Phát hành',subtitle:'Một nguồn dữ liệu QA · thay đổi được agent harden vào canonical',pending:'thay đổi chờ agent ghi nhận',download:'Tải packet',machine:'Dòng máy',function:'Chức năng',ui:'Giao diện',rounds:'Kết quả theo vòng',history:'Lịch sử',comments:'Trao đổi',comment:'Viết bình luận…',send:'Gửi',assignee:'Giao cho',priority:'Ưu tiên',status:'Trạng thái',empty:'Chưa có dữ liệu',deepAvailable:'có',deepUnavailable:'chưa có cho tiếng này'},
  en:{cases:'Test cases',defects:'Defects',release:'Release',subtitle:'One canonical QA source · agents harden staged changes',pending:'changes waiting for agent hardening',download:'Download packet',machine:'Machine line',function:'Function',ui:'Interface',rounds:'Results by round',history:'History',comments:'Discussion',comment:'Write a comment…',send:'Send',assignee:'Assignee',priority:'Priority',status:'Status',empty:'No data yet',deepAvailable:'available',deepUnavailable:'unavailable for this language'}
};
var STATUS_VI={TODO:'Chưa làm',DOING:'Đang làm',PASS:'Đạt',FAIL:'Hỏng',BLOCKED:'Bị chặn',ASSIGNED:'Đã giao',FIXING:'Đang sửa',RETEST:'Chờ retest',VERIFIED:'Đã xác nhận',CLOSED:'Đóng',REOPENED:'Mở lại',REJECTED:'Từ chối',DEFERRED:'Hoãn'};
var t=TEXT[D.language]||TEXT.en;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ls(){try{return JSON.parse(localStorage.getItem(KEY)||'{"edits":[],"comments":[],"evidence":[]}')}catch(e){return {edits:[],comments:[],evidence:[]}}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s));paintPending()}
function label(v){return D.language==='vi'?(STATUS_VI[v]||v):v}
function options(values,current){return values.map(function(v){return '<option value="'+esc(v)+'" data-machine-value="'+esc(v)+'"'+(v===current?' selected':'')+'>'+esc(label(v))+'</option>'}).join('')}
function entity(type,id){return (type==='case'?D.cases:D.defects).find(function(x){return x.id===id})}
function stagedValue(type,id,field,base){var e=ls().edits.filter(function(x){return x.entity===type&&x.id===id&&x.field===field}).pop();return e?e.to:base}
function stage(type,id,field,to){var base=entity(type,id);if(!base)return;var s=ls(),existing=s.edits.find(function(x){return x.entity===type&&x.id===id&&x.field===field});if(existing)existing.to=to;else s.edits.push({entity:type,id:id,field:field,from:base[field],to:to});s.edits=s.edits.filter(function(x){return x.from!==x.to});save(s)}
function stageComment(type,id,text){text=String(text||'').trim();if(!text)return;var s=ls();s.comments.push({id:'native-'+Date.now()+'-'+s.comments.length,entity:type,entityId:id,author:D.commentAuthor||'Reviewer',text:text,when:new Date().toISOString(),source:'native'});save(s);render()}
function stageEvidence(id,item){var s=ls();item.entity='defect';item.entityId=id;item.id=item.id||('native-'+id+'-evidence-'+Date.now());item.addedAt=item.addedAt||new Date().toISOString();s.evidence.push(item);save(s);render()}
function mark(status){var c=['PASS','VERIFIED','CLOSED'].includes(status)?'pass':['FAIL','REOPENED','REJECTED'].includes(status)?'fail':['BLOCKED','DEFERRED'].includes(status)?'blocked':'work';return '<span class="state-mark '+c+'">'+esc(status.slice(0,1))+'</span>'}
function control(type,id,field,value,values){return '<label><span class="control-label">'+esc(t[field]||field)+'</span><select data-entity="'+type+'" data-id="'+esc(id)+'" data-edit-field="'+field+'">'+options(values,stagedValue(type,id,field,value))+'</select></label>'}
function assignee(type,id,value){return '<label><span class="control-label">'+esc(t.assignee)+'</span><input type="text" data-entity="'+type+'" data-id="'+esc(id)+'" data-edit-field="assignee" value="'+esc(stagedValue(type,id,'assignee',value))+'"></label>'}
function comments(type,item){var staged=ls().comments.filter(function(c){return c.entity===type&&c.entityId===item.id});var all=(item.comments||[]).map(function(c){return Object.assign({pending:false},c)}).concat(staged.map(function(c){return Object.assign({pending:true},c)}));var body=all.length?all.map(function(c){return '<div class="comment'+(c.pending?' pending':'')+'"><div class="comment-head"><b>'+esc(c.author)+'</b> · '+esc(c.when||'')+(c.pending?' · pending':'')+'</div>'+esc(c.text)+'</div>'}).join(''):'<div class="section-note">'+esc(t.empty)+'</div>';return '<div class="card"><h3>'+esc(t.comments)+'</h3><div class="comments">'+body+'</div><form class="composer" data-comment-form="'+type+'" data-id="'+esc(item.id)+'"><input type="text" name="comment" placeholder="'+esc(t.comment)+'" aria-label="'+esc(t.comment)+'"><button>'+esc(t.send)+'</button></form></div>'}
function history(item){var rows=(item.history||[]).map(function(h){return '<div class="event"><strong>'+esc(h.who)+'</strong><span>'+esc(h.field)+' · '+esc(h.from)+' → '+esc(h.to)+'</span><time>'+esc(h.when)+'</time></div>'}).join('');return '<div class="card"><h3>'+esc(t.history)+'</h3><div class="timeline">'+(rows||'<span class="section-note">'+esc(t.empty)+'</span>')+'</div></div>'}
function caseSourceTraceability(id){var markup='';document.querySelectorAll('template[data-case-sources]').forEach(function(node){if(node.getAttribute('data-case-sources')===id)markup=node.innerHTML});return markup}
function caseDetail(c){var rounds=(c.results||[]).map(function(r){return '<div class="event"><strong>R'+esc(r.round)+'</strong><span>Function '+esc(r.functionVerdict)+' · UI '+esc(r.uiVerdict)+'</span><time>'+esc(r.recordedAt)+'</time></div>'}).join('');var w=c.work;var progress=w?'<div class="card work-progress"><h3>'+(D.language==='vi'?'Tiến độ công việc':'Work progress')+' · '+esc(w.state)+'</h3><p><b>'+(D.language==='vi'?'Việc tiếp theo':'Next action')+':</b> '+esc(w.nextAction)+'</p><p><b>'+(D.language==='vi'?'Còn cần kiểm tra':'Remaining checks')+':</b> '+esc((w.remainingChecks||[]).join(' · '))+'</p>'+(w.blocker?'<p><b>'+(D.language==='vi'?'Đang chặn':'Blocked')+':</b> '+esc(w.blocker.kind)+' · '+esc(w.blocker.operation)+' · '+esc(w.blocker.code)+' · '+esc(w.blocker.owner)+' · '+esc(w.blocker.unblockCondition)+'</p>':'')+(w.attemptRef?'<p><b>'+(D.language==='vi'?'Lần thử':'Attempt')+':</b> '+esc(w.attemptRef)+'</p>':'')+'</div>':'';return '<div class="detail"><div class="human"><div class="summary"><b>'+esc(t.function)+'</b>'+esc(c.humanSummary&&c.humanSummary.function)+'</div><div class="summary"><b>'+esc(t.ui)+'</b>'+esc(c.humanSummary&&c.humanSummary.ui)+'</div></div>'+progress+caseSourceTraceability(c.id)+'<details class="machine"><summary>'+esc(t.machine)+'</summary><div class="mono" data-machine-value="'+esc(c.status)+'">STATUS '+esc(c.status)+'\nFUNCTION '+esc(c.functionVerdict)+'\nUI '+esc(c.uiVerdict)+'\nRULE '+esc(c.machine&&c.machine.rule)+'\nSELECTOR '+esc(c.machine&&c.machine.selector)+'</div></details><div class="subgrid"><div class="card"><h3>'+esc(t.rounds)+'</h3><div class="timeline">'+rounds+'</div></div>'+comments('case',c)+'</div><div class="subgrid">'+history(c)+'<div class="card"><h3>Evidence</h3>'+esc((c.evidence||[]).join(' · ')||t.empty)+'</div></div></div>'}
function findingEvidence(id){var markup='';document.querySelectorAll('template[data-defect-evidence]').forEach(function(node){if(node.getAttribute('data-defect-evidence')===id)markup=node.innerHTML});return markup?'<div class="card" style="margin-top:14px"><h3>Finding evidence</h3><div class="evidence-pairs">'+markup+'</div></div>':''}
function defectHandoff(id){var markup='';document.querySelectorAll('template[data-defect-handoff]').forEach(function(node){if(node.getAttribute('data-defect-handoff')===id)markup=node.innerHTML});return markup}
function defectDetail(d){var pending=ls().evidence.filter(function(e){return e.entityId===d.id});var proof=(d.fixEvidence||[]).map(function(e){return '<span class="chip">'+esc(e.path)+'</span>'}).concat(pending.map(function(e){return '<span class="chip pending">'+esc(e.path)+' · pending</span>'})).join('');var action=defectHandoff(d.id);return '<div class="detail">'+action+'<div class="human"><div class="summary"><b>Expected</b>'+esc(d.expected)+'</div><div class="summary"><b>Actual</b>'+esc(d.actual)+'</div></div><details class="machine"><summary>'+esc(t.machine)+'</summary><div class="mono" data-machine-value="'+esc(d.status)+'">STATUS '+esc(d.status)+'\nCASE '+esc(d.caseId)+'\nREPRO '+esc(d.repro)+'</div></details><div class="subgrid">'+history(d)+comments('defect',d)+'</div>'+findingEvidence(d.id)+'<div class="card" style="margin-top:14px"><h3>Fix evidence</h3><div class="evidence-list">'+(proof||'<span class="section-note">'+esc(t.empty)+'</span>')+'</div><div class="evidence-tools"><input type="file" data-fix-file="'+esc(d.id)+'" accept="image/*,video/*"><button type="button" class="evidence-button" data-fix-link="'+esc(d.id)+'">Commit / link</button></div></div></div>'}
function itemRow(type,item){var related=type==='defect'?'<span class="related">↗ '+esc(item.caseId)+'</span>':'';return '<details class="item" data-entity-row="'+type+'" data-id="'+esc(item.id)+'"><summary class="row"><div class="identity">'+mark(stagedValue(type,item.id,'status',item.status))+'<div><div class="title">'+esc(item.title)+related+'</div><div class="id">'+esc(item.id)+'</div></div></div><div>'+control(type,item.id,'status',item.status,STATUSES)+'</div><div class="priority-cell">'+control(type,item.id,'priority',item.priority,PRIORITIES)+'</div><div class="assignee-cell">'+assignee(type,item.id,item.assignee)+'</div></summary>'+(type==='case'?caseDetail(item):defectDetail(item))+'</details>'}
function list(id,type,items){document.getElementById(id).innerHTML=items.length?items.map(function(x){return itemRow(type,x)}).join(''):'<div class="empty">'+esc(t.empty)+'</div>'}
function paintPending(){var s=ls(),count=s.edits.length+s.comments.length+(s.evidence||[]).length,bar=document.querySelector('.pending-bar');document.getElementById('pending-count').textContent=count;bar.hidden=count===0}
function render(){document.documentElement.lang=D.language||'en';document.title='QA Board · '+D.title;document.getElementById('title').textContent=D.title;document.getElementById('subtitle').textContent=t.subtitle;document.getElementById('case-title').textContent=t.cases;document.getElementById('defect-title').textContent=t.defects;document.getElementById('release-title').textContent=t.release;document.getElementById('pending-label').textContent=t.pending;document.getElementById('packet').textContent=t.download;document.getElementById('case-note').textContent=(D.cases||[]).length+' cases · round '+D.currentRound;document.getElementById('defect-note').textContent=(D.defects||[]).length+' defects';document.getElementById('meta').innerHTML=['App · '+D.app,'Env / DB · '+D.envDb,'Viewport · '+D.viewport,'Language · '+D.language,'Deep check · '+(D.deepCheck==='available'?t.deepAvailable:t.deepUnavailable)].map(function(x){return '<span>'+esc(x)+'</span>'}).join('');document.getElementById('legend').innerHTML=STATUSES.map(function(s){return '<span class="chip status-'+s+'" title="'+esc(s)+'">'+esc(label(s))+'</span>'}).join('');list('cases','case',D.cases||[]);list('defects','defect',D.defects||[]);document.getElementById('release').innerHTML='<b>'+esc(D.release&&D.release.verdict)+'</b><div class="section-note">'+esc((D.release&&D.release.risks||[]).join(' · '))+'</div>';bind();paintPending()}
function bind(){document.querySelectorAll('[data-edit-field]').forEach(function(el){el.addEventListener('click',function(e){e.stopPropagation()});el.addEventListener('change',function(){stage(el.dataset.entity,el.dataset.id,el.dataset.editField,el.value)})});document.querySelectorAll('[data-comment-form]').forEach(function(form){form.addEventListener('submit',function(e){e.preventDefault();stageComment(form.dataset.commentForm,form.dataset.id,new FormData(form).get('comment'))})});document.querySelectorAll('[data-fix-file]').forEach(function(input){input.addEventListener('change',function(){var file=input.files&&input.files[0];if(!file)return;var type=file.type.indexOf('video/')===0?'video':'image';var item={type:type,path:file.name,size:file.size,mime:file.type};if(type==='image'&&file.size<=4*1024*1024){var reader=new FileReader();reader.onload=function(){item.dataUrl=reader.result;stageEvidence(input.dataset.fixFile,item)};reader.readAsDataURL(file)}else stageEvidence(input.dataset.fixFile,item)})});document.querySelectorAll('[data-fix-link]').forEach(function(button){button.addEventListener('click',function(){var value=window.prompt('Commit SHA or evidence link');if(value)stageEvidence(button.dataset.fixLink,{type:/^https?:/.test(value)?'link':'commit',path:value})})})}
window.__docColabState=function(){return {docId:D.boardId,rev:D.rev,lsKey:KEY,protocol:'doc-colab/v2',baseRev:D.rev,conflict:false,staging:ls(),edits:ls().edits,comments:ls().comments,evidence:ls().evidence||[]}};
window.__docColabClear=function(){localStorage.removeItem(KEY);render();return true};
